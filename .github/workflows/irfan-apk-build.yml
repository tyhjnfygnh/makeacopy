name: Build Irfan Offline PDF APK

on:
  push:
    branches:
      - irfan-apk-build
    paths:
      - '.github/workflows/irfan-apk-build.yml'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradlew'
      - 'gradle.properties'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11.2
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.2'

      - name: Install Android SDK NDK
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_HOME} "ndk;28.0.13004108"
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Set up CMake 3.31.6
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'

      - name: Install Python deps for ONNX Runtime
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flatbuffers

      - name: Export native build environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "BUILD_GENERATOR=Unix Makefiles" >> $GITHUB_ENV
          echo "ORT_CMAKE=$(which cmake)" >> $GITHUB_ENV
          echo "OPENCV_CMAKE=$(which cmake)" >> $GITHUB_ENV
          echo "PY3_BIN=$(which python3)" >> $GITHUB_ENV
          echo "ABIS=arm64-v8a armeabi-v7a x86_64 x86" >> $GITHUB_ENV
          echo "SOURCE_DATE_EPOCH=1700000000" >> $GITHUB_ENV
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "LC_ALL=C" >> $GITHUB_ENV
          echo "LANG=C" >> $GITHUB_ENV
          echo "PYTHONHASHSEED=0" >> $GITHUB_ENV
          cmake --version
          python3 --version

      - name: Build OpenCV native libraries
        run: |
          chmod +x scripts/build_opencv_android.sh
          REQUIRE_PINNED_JNI=1 VERBOSE=1 DEBUG=1 ./scripts/build_opencv_android.sh

      - name: Prepare OpenCV for app
        run: |
          chmod +x scripts/prepare_opencv.sh
          ./scripts/prepare_opencv.sh

      - name: Build ONNX Runtime
        run: |
          chmod +x scripts/build_onnxruntime_android.sh
          ./scripts/build_onnxruntime_android.sh

      - name: Build installable offline APK
        run: ./gradlew --no-daemon :app:assembleStandardRelease -PenableAbiSplits=false -Pedition=full

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Irfan-Offline-PDF-APK
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
          retention-days: 14
